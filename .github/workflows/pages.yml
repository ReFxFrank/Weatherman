# Ember on GitHub Pages: build the SPA and bake live FIRMS fire data into
# static binary payloads, redeployed on a schedule so the site stays a live
# feed with no server. FIRMS_MAP_KEY (optional, enables Landsat + the area
# API) lives in Actions secrets and never reaches the client.
#
# One-time setup (requires repo admin, can't be automated by this token):
#   Settings → Pages → Source: "GitHub Actions"
# Until then, runs succeed but skip deployment with a notice.
name: Deploy Pages (app + live fire data)

on:
  schedule:
    # Data refresh cadence. FIRMS NRT lags satellite overpass by ~1h anyway;
    # 20 min stays well inside Pages' ~10 deploys/hour soft limit.
    # NOTE: scheduled workflows only run from the repo's default branch.
    - cron: '*/20 * * * *'
  workflow_dispatch:
  push:
    branches: [main, claude/ember-wildfire-map-0vcsas]

permissions:
  contents: read
  pages: write
  id-token: write

# Never queue more than one deploy; a fresher run supersedes an older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check-pages:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages not enabled yet::One-time setup: repo Settings → Pages → Source: 'GitHub Actions'. Skipping deploy (HTTP $code). The next scheduled run deploys automatically once enabled."
          fi

  build-and-deploy:
    needs: check-pages
    if: needs.check-pages.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # A branch-based ("legacy") Pages config makes GitHub run its own Jekyll
      # deploy of the RAW SOURCE TREE on every push, racing this workflow —
      # whichever finishes last wins, and when the legacy one wins the site is
      # a white page (source index.html references /src/main.tsx). Flip the
      # site to workflow-only deployments; harmless no-op once flipped.
      - name: Ensure Pages deploys from Actions only (kill the legacy race)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" | jq -r '.build_type // empty')
          echo "Pages build_type: '$current'"
          if [ -n "$current" ] && [ "$current" != "workflow" ]; then
            code=$(curl -s -o /tmp/pages-update.txt -w "%{http_code}" -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
              -d '{"build_type":"workflow"}')
            if [ "$code" = "204" ] || [ "$code" = "200" ]; then
              echo "::notice title=Pages switched to workflow deploys::The legacy branch/Jekyll deploy no longer races this workflow."
            else
              cat /tmp/pages-update.txt || true
              echo "::warning title=Pages still deploys the raw branch::Could not switch build_type (HTTP $code). One-time manual fix: Settings → Pages → Build and deployment → Source: 'GitHub Actions'."
            fi
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build SPA in static-data mode
        run: VITE_BASE="/${GITHUB_REPOSITORY#*/}/" VITE_DATA_MODE=static npm run build

      - name: Bake live FIRMS data
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          OUT_DIR: dist/data
          # Per-file fallback: when an upstream fetch fails (FIRMS was
          # unreachable from Actions runners for ~1h tonight), reuse the
          # currently-deployed payload instead of dropping the dataset.
          FALLBACK_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: npx tsx scripts/bake-data.ts

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
